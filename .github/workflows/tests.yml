# Plugin test suite on clean Linux and Windows (Git Bash) runners. The RPG MMO workspace (server, client, Netcode,
# UnityDots, UIToolkit) is not available here, so every run uses `--no-workspace --no-claude`: each check that needs
# those repos on disk (registry paths, facts, pin-status, wire-parity, package-ready, netcode headless, live
# context/status) is reported as SKIP, never as PASS. Those still have to be run locally with the workspace
# (`tests/run-all.sh`) before a release.
#
# On pull_request and push the plan job (scripts/ci-plan.py, which calls tests/affected.py) selects only the suites a
# change affects, one matrix job per {suite, os}. A change to CI plumbing (workflows, actions, run-all, affected.py,
# the plan itself) or a base that cannot be used plans every suite. workflow_dispatch with `full=true` (the default)
# runs every suite; `full=false` plans from the `base` input, and no or an unusable base plans every suite. A suite job
# runs only its planned cases (`tests/run-all.sh --only-cases`; `ALL` runs every case, and a case subset publishes no
# suite PASS record). A suite runs on ubuntu-24.04, and also on windows-2025 when tests/ci-windows-suites.txt names
# it. The inline checks (JSON parse, bash -n, py_compile, ...) always run on both OSes, also when no suite is
# selected. `ci-ok` is the single required check: it fails when any needed job failed or was cancelled and passes
# when the suite matrix is skipped because nothing is affected.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every suite (otherwise only the suites affected since the base input)
        type: boolean
        default: true
      base:
        description: A sha or a ref the checkout has (e.g. origin/main); used only when full is false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      full: ${{ steps.plan.outputs.full }}
      inline: ${{ steps.inline.outputs.inline }}
    steps:
      - name: LF checkout (shell scripts must not get CRLF on Windows)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-ci

      - name: Plan the suites (scripts/ci-plan.py)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          FULL_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
          DISPATCH_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.base || '' }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            workflow_dispatch) [ "$FULL_INPUT" = "true" ] || base="$DISPATCH_BASE" ;;
          esac
          args=(--base "$base" --event "$EVENT" --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT")
          [ "$FULL_INPUT" = "true" ] && args+=(--full)
          python3 -B scripts/ci-plan.py "${args[@]}"

      # The inline checks do not depend on the plan: they run even when no suite is selected.
      - name: Inline checks always run
        id: inline
        run: echo 'inline=true' >> "$GITHUB_OUTPUT"

  suite:
    name: suite ${{ matrix.suite }} (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: LF checkout (shell scripts must not get CRLF on Windows)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Artifact name
        env:
          SUITE: ${{ matrix.suite }}
          OS: ${{ matrix.os }}
        run: |
          name=$(printf '%s' "$SUITE" | tr '/.' '--')
          echo "ARTIFACT=suite-log-$name-$OS" >> "$GITHUB_ENV"

      - name: Run the suite
        env:
          SUITE: ${{ matrix.suite }}
          CASES: ${{ matrix.cases }}
        # Always through run-all: its run line sets the suite's environment (e.g. `env -u TMPDIR`). A plan row with a
        # case subset passes it with --only-cases (run-all hands it to the suite as --case); ALL runs every case.
        run: |
          set -o pipefail
          echo "plan cases: $CASES"
          args=(--only-suites "$SUITE")
          if [ -n "$CASES" ] && [ "$CASES" != "ALL" ]; then
            args+=(--only-cases "$CASES")
          fi
          tests/run-all.sh "${args[@]}" --no-workspace --no-claude 2>&1 | tee suite.log

      - name: Summary
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
          CASES: ${{ matrix.cases }}
          OS: ${{ matrix.os }}
        run: |
          {
            echo "### $SUITE ($OS, cases: $CASES)"
            echo '```'
            grep -E '^(FAIL|SKIP) |^run-all:|^wall time:' suite.log || echo 'no suite.log'
            echo '```'
            echo 'Workspace checks are skipped here; run `tests/run-all.sh` locally with the workspace.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ env.ARTIFACT }}
          path: suite.log
          retention-days: 14
          if-no-files-found: warn

  inline-checks:
    name: inline checks (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.inline == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: LF checkout (shell scripts must not get CRLF on Windows)
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: tests/run-all.sh --inline-only --no-workspace --no-claude
        run: |
          set -o pipefail
          tests/run-all.sh --inline-only --no-workspace --no-claude 2>&1 | tee inline.log

      - name: Summary
        if: always()
        env:
          OS: ${{ matrix.os }}
        run: |
          {
            echo "### inline checks ($OS)"
            echo '```'
            grep -E '^(FAIL|SKIP) |^run-all:|^wall time:' inline.log || echo 'no inline.log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: inline-log-${{ matrix.os }}
          path: inline.log
          retention-days: 14
          if-no-files-found: warn

  # The single required check (branch protection names only `ci-ok`). `always()` keeps it running when a needed job
  # failed or was skipped: a skipped suite job (count 0, nothing affected) passes, a failed or cancelled job fails.
  ci-ok:
    name: ci-ok
    needs: [plan, suite, inline-checks]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          plan=$(echo "$NEEDS" | jq -r '.plan.result')
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")')
          if [ "$plan" != "success" ]; then
            echo "ci-ok: plan is $plan, not success" >&2
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "ci-ok: failed or cancelled: $bad" >&2
            exit 1
          fi
          echo "ci-ok: all needed jobs succeeded or were skipped"
